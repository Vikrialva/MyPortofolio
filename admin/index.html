<!DOCTYPE html>
<html lang="id" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Portfolio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { colors: { accent: '#f97316' } } } };
</script>
</head>
<body class="bg-zinc-100 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen">

<!-- ═══ LOGIN ═══ -->
<div id="login" class="min-h-screen flex items-center justify-center p-6 hidden">
  <form id="login-form" class="w-full max-w-sm bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-200 dark:border-zinc-800 p-8 shadow-sm">
    <h1 class="font-bold text-2xl mb-1">Admin Panel</h1>
    <p class="text-sm text-zinc-500 mb-6">Masuk untuk mengubah konten website.</p>
    <label class="block text-sm font-medium mb-1.5">Username</label>
    <input id="l-user" autocomplete="username" class="w-full px-3.5 py-2.5 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-950 mb-4 text-sm outline-none focus:border-accent">
    <label class="block text-sm font-medium mb-1.5">Password</label>
    <input id="l-pass" type="password" autocomplete="current-password" class="w-full px-3.5 py-2.5 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-950 mb-5 text-sm outline-none focus:border-accent">
    <p id="l-err" class="text-sm text-red-600 dark:text-red-400 mb-4 hidden"></p>
    <button class="w-full bg-accent hover:bg-orange-600 text-white font-medium py-2.5 rounded-lg text-sm transition-colors">Masuk</button>
  </form>
</div>

<!-- ═══ APP ═══ -->
<div id="app" class="hidden">
  <header class="sticky top-0 z-20 bg-white/90 dark:bg-zinc-900/90 backdrop-blur border-b border-zinc-200 dark:border-zinc-800">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="w-8 h-8 rounded-lg bg-accent text-white grid place-items-center font-bold text-sm">A</span>
        <span class="font-semibold">Portfolio Admin</span>
      </div>
      <div class="flex items-center gap-2">
        <a href="/" target="_blank" class="text-sm px-3.5 py-2 rounded-lg border border-zinc-300 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors">Lihat Website</a>
        <button id="logout" class="text-sm px-3.5 py-2 rounded-lg border border-zinc-300 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors">Keluar</button>
      </div>
    </div>
  </header>

  <nav class="border-b border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 sticky top-16 z-10">
    <div class="max-w-6xl mx-auto px-6 flex gap-1 overflow-x-auto">
      <button data-tab="projects" class="tab px-4 py-3 text-sm font-medium border-b-2 border-transparent hover:text-accent transition-colors">Projects</button>
      <button data-tab="hero" class="tab px-4 py-3 text-sm font-medium border-b-2 border-transparent hover:text-accent transition-colors">Hero</button>
      <button data-tab="services" class="tab px-4 py-3 text-sm font-medium border-b-2 border-transparent hover:text-accent transition-colors">Layanan</button>
      <button data-tab="work" class="tab px-4 py-3 text-sm font-medium border-b-2 border-transparent hover:text-accent transition-colors">Section Work</button>
      <button data-tab="about" class="tab px-4 py-3 text-sm font-medium border-b-2 border-transparent hover:text-accent transition-colors">About</button>
      <button data-tab="cta" class="tab px-4 py-3 text-sm font-medium border-b-2 border-transparent hover:text-accent transition-colors">Kontak / CTA</button>
      <button data-tab="contact" class="tab px-4 py-3 text-sm font-medium border-b-2 border-transparent hover:text-accent transition-colors">Navigasi &amp; Footer</button>
      <button data-tab="seo" class="tab px-4 py-3 text-sm font-medium border-b-2 border-transparent hover:text-accent transition-colors">SEO</button>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-6 py-8 pb-28">
    <div id="panel" class="space-y-6"></div>
  </main>

  <div id="savebar" class="fixed bottom-0 inset-x-0 z-20 bg-white/95 dark:bg-zinc-900/95 backdrop-blur border-t border-zinc-200 dark:border-zinc-800 hidden">
    <div class="max-w-6xl mx-auto px-6 py-3 flex items-center justify-between gap-4">
      <span id="save-status" class="text-sm text-zinc-500">Ada perubahan yang belum disimpan.</span>
      <div class="flex gap-2">
        <button id="save-reset" class="text-sm px-4 py-2 rounded-lg border border-zinc-300 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-800">Batal</button>
        <button id="save-btn" class="text-sm px-5 py-2 rounded-lg bg-accent hover:bg-orange-600 text-white font-medium">Simpan Perubahan</button>
      </div>
    </div>
  </div>
</div>

<!-- ═══ MODAL PROJECT ═══ -->
<div id="modal" class="fixed inset-0 z-30 hidden">
  <div class="absolute inset-0 bg-black/60" data-close></div>
  <div class="relative h-full overflow-y-auto p-4 sm:p-8">
    <div class="max-w-3xl mx-auto bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-200 dark:border-zinc-800 shadow-xl">
      <div class="flex items-center justify-between px-6 py-4 border-b border-zinc-200 dark:border-zinc-800">
        <h2 id="m-title" class="font-semibold">Tambah Project</h2>
        <button data-close class="w-9 h-9 grid place-items-center rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800">&times;</button>
      </div>

      <form id="m-form" class="p-6 space-y-5">
        <input type="hidden" id="m-id">

        <div class="grid sm:grid-cols-2 gap-4">
          <div><label class="lbl">Judul (EN)</label><input id="m-title-en" class="inp"></div>
          <div><label class="lbl">Judul (ID)</label><input id="m-title-id" class="inp"></div>
        </div>
        <div class="grid sm:grid-cols-2 gap-4">
          <div><label class="lbl">Subtitle (EN)</label><input id="m-sub-en" class="inp"></div>
          <div><label class="lbl">Subtitle (ID)</label><input id="m-sub-id" class="inp"></div>
        </div>

        <div><label class="lbl">Deskripsi (EN)</label><textarea id="m-desc-en" rows="3" class="inp"></textarea></div>
        <div><label class="lbl">Deskripsi (ID)</label><textarea id="m-desc-id" rows="3" class="inp"></textarea></div>

        <div class="grid sm:grid-cols-3 gap-4">
          <div><label class="lbl">Kategori (EN)</label><input id="m-cat-en" class="inp" placeholder="Web App"></div>
          <div><label class="lbl">Kategori (ID)</label><input id="m-cat-id" class="inp" placeholder="Aplikasi Web"></div>
          <div><label class="lbl">Tags (pisahkan koma)</label><input id="m-tags" class="inp" placeholder="Laravel, MySQL"></div>
        </div>

        <div class="grid sm:grid-cols-2 gap-4">
          <div><label class="lbl">Link Repository</label><input id="m-repo" class="inp" placeholder="https://github.com/..."></div>
          <div><label class="lbl">Link Live Demo</label><input id="m-live" class="inp" placeholder="https://..."></div>
        </div>

        <div>
          <label class="lbl">Gambar Cover</label>
          <div class="flex items-start gap-4">
            <div id="m-cover-prev" class="w-40 h-24 rounded-lg bg-zinc-100 dark:bg-zinc-800 grid place-items-center overflow-hidden border border-zinc-200 dark:border-zinc-800 text-xs text-zinc-400">No image</div>
            <div class="flex-1">
              <input type="file" id="m-cover-file" accept="image/*" class="text-sm">
              <p class="text-xs text-zinc-500 mt-2">Maksimal 5&nbsp;MB. JPG/PNG/WebP.</p>
              <button type="button" id="m-cover-clear" class="text-xs text-red-600 dark:text-red-400 mt-2 hidden">Hapus cover</button>
            </div>
          </div>
        </div>

        <div>
          <label class="lbl">Galeri Gambar</label>
          <input type="file" id="m-gallery-file" accept="image/*" multiple class="text-sm">
          <p class="text-xs text-zinc-500 mt-2">Bisa pilih beberapa file sekaligus. Drag untuk mengubah urutan.</p>
          <div id="m-gallery" class="mt-3 grid grid-cols-3 sm:grid-cols-4 gap-3"></div>
        </div>

        <div class="grid sm:grid-cols-3 gap-4">
          <div><label class="lbl">Urutan</label><input id="m-order" type="number" class="inp" value="0"></div>
          <label class="flex items-center gap-2 text-sm pt-7"><input type="checkbox" id="m-featured"> Tampilkan di homepage</label>
          <label class="flex items-center gap-2 text-sm pt-7"><input type="checkbox" id="m-published" checked> Publikasikan</label>
        </div>

        <p id="m-err" class="text-sm text-red-600 dark:text-red-400 hidden"></p>
        <div class="flex gap-2 justify-end pt-2">
          <button type="button" data-close class="px-5 py-2.5 rounded-lg border border-zinc-300 dark:border-zinc-700 text-sm hover:bg-zinc-100 dark:hover:bg-zinc-800">Batal</button>
          <button type="submit" class="px-5 py-2.5 rounded-lg bg-accent hover:bg-orange-600 text-white text-sm font-medium">Simpan Project</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-40 hidden"></div>

<script src="/admin/admin.js"></script>

<style type="text/tailwindcss">
  @layer components {
    .lbl { @apply block text-sm font-medium mb-1.5; }
    .inp { @apply w-full px-3.5 py-2.5 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-950 text-sm outline-none focus:border-accent; }
    .card { @apply bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-200 dark:border-zinc-800 p-5; }
  }
  .tab.active { @apply border-accent text-accent; }
</style>
</body>
</html>
